 <style type="text/css">#button {
    animation: pair 2.5s infinite;
    }
    @keyframes pair {
    /* 1 presses at 1s (40%) */
    44% {
    fill: #0074CC;
    }
    0%, 36%, 56%, 100% {
    fill: rgba(255,255,255,0);
    }
    }
    #led {
    animation: blink 2.5s infinite;
    }
    @keyframes blink {
    /* blink at 1.25s (50%) */
    55% {
    fill: #A800FF;
    }
    0%, 50%, 60%, 100% {
    fill: rgba(255,255,255,0);
    }
    }</style>
