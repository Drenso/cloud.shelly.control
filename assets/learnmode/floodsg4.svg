    <style type="text/css">
        #button {
            animation: pair 10s infinite;
        }
        @keyframes pair {
            /* 3 presses between 1s–2.5s (10%–25%) */
            11%, 17%, 23% {
                fill: #0074CC;
            }
            0%, 9%, 14%, 20%, 26%, 100% {
                fill: rgba(255,255,255,0);
            }
        }
        #led {
            animation: blink 10s infinite;
        }
        @keyframes blink {
            /* blink from 2.5s–9s (25%–90%), 8 pulses */
            30%, 38%, 46%, 54%, 62%, 70%, 78%, 86% {
                fill: #A800FF;
            }
            0%, 25%, 34%, 42%, 50%, 58%, 66%, 74%, 82%, 90%, 100% {
                fill: rgba(255,255,255,0);
            }
        }
    </style>
