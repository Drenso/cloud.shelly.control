<script type="text/javascript">
  Homey.setTitle(__('pair.ble_information.title'));
</script>

<style type="text/css">
  .logo {
    display: block;
    width: 50vw;
    margin: 1em auto;
    background-position: center center;
    background-repeat: no-repeat;
    background-size: contain;
  }
  .description {
    margin-bottom: 1em;
  }
</style>

<main class="homey-main">
  <img id="login-credentials-logo" class="logo" src="../../../assets/icon.svg" alt="Shelly logo" />
  <div class="description" data-i18n="pair.ble_information.content"></div>
  <label class="homey-form-checkbox">
    <input class="homey-form-checkbox-input" id="ble-information-hide" type="checkbox" name="useForAll" />
    <span class="homey-form-checkbox-checkmark"></span>
    <span class="homey-form-checkbox-text" data-i18n="pair.ble_information.hide"></span>
  </label>
</main>

<script>
  /** @type HTMLInputElement */
  const hideCheckBox = document.getElementById('ble-information-hide');
  hideCheckBox.onchange = () => {
    Homey.emit('hide-ble-information', hideCheckBox.checked);
  };
</script>
