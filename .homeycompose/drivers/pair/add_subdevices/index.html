<script type="text/javascript">
  Homey.setTitle(Homey.__('pair.add_devices.title'));
  Homey.showLoadingOverlay(Homey.__('pair.add_devices.loading'));

  Homey.emit('add_subdevices', {})
    .then(async result => {
      console.log('Adding devices:', JSON.stringify(result));
      for (const device of result) {
        await Homey.createDevice(device);
      }
      await Homey.emit('done');
    })
    .catch(err => Homey.alert(err))
    .finally(() => {
      return Homey.done();
    });
</script>
