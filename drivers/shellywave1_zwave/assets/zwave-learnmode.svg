    <title>cloud.shelly.control/drivers/shellywave1/assets/pair</title>
    <style type="text/css">
        #button {
            animation: pair 15s infinite;
        } 
        
        @keyframes pair {
            10%, 30%, 50%, 70% {
                fill: #0074CC;
            }
            0%, 7%, 35%, 45%, 75%, 100% {
                fill: rgba(255,255,255,0);
            }
        }
        #led {
            animation: blink 15s infinite;
        } 
        
        @keyframes blink {
            28%, 65%, 71%, 75%, 79%, 83%, 87%, 91%, 95%  {
                fill: #4800ff;
            }
            0%, 25%, 67%, 73%,  77%, 81%,  85%, 89%, 93%, 97%, 100%  {
                fill: rgba(255,255,255,0);
            }
        }
    </style>
