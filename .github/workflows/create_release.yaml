name: Create Release
on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: 26

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true

  build_executable:
    name: Generate release
    runs-on: ${{ matrix.os }}
    needs: create_release
    strategy:
      matrix:
        os:
          - windows-latest
          - windows-11-arm
          - macos-26-intel
          - macos-latest
          - ubuntu-26.04
          - ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://npm.drenso.dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Cache NPM dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |-
            ${{ case(
              matrix.os == 'windows-latest', 'C:/tmp/npm-cache',
              '/tmp/npm-cache'
            ) }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install NPM dependencies
        run: npm ci --prefer-offline --no-audit --cache /tmp/npm-cache

      - name: Build interview executable
        run: |
          npm run interview-build
          npm run interview-sea

      - name: Rename executable
        run: |
          mv tools/interview-sea/interview-shelly-control tools/interview-sea/interview-shelly-control-${{ runner.os }}-${{ runner.arch}}${{ matrix.os == 'windows-latest' && '.exe' || '' }}

      - name: Upload executable
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: false
          overwrite_files: false
          files: |
            tools/interview-sea/interview-shelly-control*

  publish-release:
    runs-on: ubuntu-latest
    needs: build_executable
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: false
          overwrite_files: false
          make_latest: true
